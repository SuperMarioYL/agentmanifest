<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" data-palette="56e66a-6ae7bd-bef6ac-e8c27d262ed9">
  <title>scan 数据流:collectors → keyring detector → manifest builder</title>
  <style>
    text { font-family: -apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; }
    .a1 { animation: drift 6s ease-in-out infinite alternate; }
    .a2 { animation: drift 8s ease-in-out infinite alternate-reverse; }
    .a3 { animation: drift 9.5s ease-in-out infinite alternate; }
    .flow { stroke-dasharray: 7 9; animation: dash 1.8s linear infinite; }
    .glow { animation: glow 3.2s ease-in-out infinite alternate; }
    .pulse { animation: slide 4.5s ease-in-out infinite; }
    .orbit { transform-box: fill-box; transform-origin: center; animation: sway 9s ease-in-out infinite alternate; }
    .orbit2 { transform-box: fill-box; transform-origin: center; animation: sway 11s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(7px, -9px); } }
    @keyframes dash { to { stroke-dashoffset: -64; } }
    @keyframes glow { from { opacity: .5; } to { opacity: 1; } }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(0px); } }
    @keyframes sway { from { transform: rotate(-2.4deg); } to { transform: rotate(2.4deg); } }
    @media (prefers-reduced-motion: reduce) {
      .a1,.a2,.a3,.flow,.glow,.pulse,.orbit,.orbit2 { animation: none; }
    }
</style>
